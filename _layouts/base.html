<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% if page.p5 %}
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/addons/p5.sound.min.js"></script>
  {% endif %}

  {{ page.head }}
</head>
<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    <div class="nav-links">
      <a href="{{ '/DissertationProposal/' | relative_url }}">Dissertation Proposal</a>
    </div>
  </nav>

  <main{% if page.collapsible %} data-collapsible{% endif %}>
    {{ content }}
  </main>

  <script src="{{ '/assets/js/collapsible-headings.js' | relative_url }}"></script>

  <footer>
    <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
