<script type="module">
import * as THREE from 'three'
import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
const GUI = window.lil.GUI

// ======== lib/csv.js ========
// CSV in, rows out: a small reader for the files a sketch draws from. Handles quoted fields with
// commas and newlines inside them, CRLF line ends, a byte-order mark, and the SOURCE / NOTES rows
// this project's own spreadsheets carry at the bottom: any row whose number column is not a number
// is a note, not data, and is set aside. Columns are guessed by name (the term, its hit count, an
// optional parent it narrows, an optional group); pass `columns` to say otherwise.

function parseCsv(text) {
  const rows = [], row = [], src = text.replace(/^﻿/, '')
  let field = '', quoted = false
  const endField = () => { row.push(field); field = '' }
  const endRow = () => { endField(); if (row.some(v => v !== '')) rows.push(row.slice()); row.length = 0 }
  for (let i = 0; i < src.length; i++) {
    const ch = src[i]
    if (quoted) {
      if (ch === '"') { if (src[i + 1] === '"') { field += '"'; i++ } else quoted = false }
      else field += ch
    } else if (ch === '"') quoted = true
    else if (ch === ',') endField()
    else if (ch === '\n') endRow()
    else if (ch !== '\r') field += ch
  }
  if (field !== '' || row.length) endRow()
  const columns = rows.shift() ?? []
  return { columns, rows: rows.map(r => Object.fromEntries(columns.map((c, k) => [c, r[k] ?? '']))) }
}

// Which column is which. Names are matched loosely; the hits column must also hold numbers.
function guessColumns(columns, rows = [], override = {}) {
  const find = (res) => columns.find(c => res.some(re => re.test(c)))
  const numeric = c => rows.some(r => /^\s*[\d,.]+\s*$/.test(r[c] ?? ''))
  const hits = override.hits ?? columns.filter(numeric).find(c => /hit|total|result|count|^n$|number|freq/i.test(c)) ?? columns.find(numeric)
  const term = override.term ?? find([/^term$/i, /search_term|term|query|search|phrase|keyword/i, /name|label|title/i]) ?? columns.find(c => c !== hits)
  const parent = override.parent ?? find([/parent|narrow|broader|refin|derived|from_term/i])
  const group = override.group ?? find([/^group$/i, /group|round|phase|set|category|dataset|source$/i])
  return { term, hits, parent, group }
}

const asNumber = v => { const n = parseFloat(String(v ?? '').replace(/,/g, '')); return Number.isFinite(n) ? n : null }

// The data rows (a term and a number) and the note rows, kept apart.
function splitNotes(rows, cols) {
  const data = [], notes = []
  for (const r of rows) (asNumber(r[cols.hits]) === null ? notes : data).push(r)
  return { data, notes }
}

async function loadCsv(url) {
  const res = await fetch(url)
  if (!res.ok) throw new Error(`${url}: ${res.status}`)
  return parseCsv(await res.text())
}

// A CSV dropped onto an element, or chosen with the file picker, arrives as text at onText(text, name).
function acceptCsvFiles(element, onText) {
  const read = file => { if (!file) return; const fr = new FileReader(); fr.onload = () => onText(fr.result, file.name); fr.readAsText(file) }
  element.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy' })
  element.addEventListener('drop', e => { e.preventDefault(); read(e.dataTransfer.files[0]) })
  const input = document.createElement('input'); input.type = 'file'; input.accept = '.csv,text/csv'; input.style.display = 'none'
  input.addEventListener('change', () => { read(input.files[0]); input.value = '' })
  document.body.appendChild(input)
  return { openPicker: () => input.click() }
}

// ======== lib/terms.js ========
// Search terms and their narrowings, as a tree. A row is a term with a hit count. A term narrows
// another when the file says so (a parent column), or, failing that, when its words contain the
// other's whole phrase: "new materialism art education" narrows "new materialism", and
// "positionality AND intersectionality" narrows "positionality". The longest such phrase is taken
// as the parent (more hits breaks a tie), so a term sits under the nearest broader one. Nodes are
// { term, hits, group, parent, children, depth, row }; roots are the terms that narrow nothing.



const words = s => String(s).toLowerCase().replace(/["'*()\[\]]/g, ' ').replace(/\b(and|or|not)\b/g, ' ').split(/\s+/).filter(Boolean)
const phraseIn = (phrase, inWords) => {                           // the phrase's words appear in order, whole, somewhere in inWords
  if (!phrase.length || phrase.length >= inWords.length) return false
  outer: for (let i = 0; i + phrase.length <= inWords.length; i++) {
    for (let k = 0; k < phrase.length; k++) if (inWords[i + k] !== phrase[k]) continue outer
    return true
  }
  return false
}

function buildTermTree(rows, cols, { minHits = 0 } = {}) {
  const nodes = []
  for (const row of rows) {
    const hits = asNumber(row[cols.hits]); const term = String(row[cols.term] ?? '').trim()
    if (hits === null || !term || hits < minHits) continue
    nodes.push({ term, hits, group: cols.group ? String(row[cols.group] ?? '').trim() : '', parent: null, children: [], depth: 0, row, words: words(term) })
  }
  const byTerm = new Map(nodes.map(n => [n.term.toLowerCase(), n]))
  for (const n of nodes) {
    let parent = null
    if (cols.parent && row_has(n.row, cols.parent)) parent = byTerm.get(String(n.row[cols.parent]).trim().toLowerCase()) ?? null
    else {
      const candidates = nodes.filter(m => m !== n && phraseIn(m.words, n.words))
      candidates.sort((a, b) => b.words.length - a.words.length || b.hits - a.hits)
      parent = candidates[0] ?? null
    }
    if (parent && parent !== n) { n.parent = parent; parent.children.push(n) }
  }
  const roots = nodes.filter(n => !n.parent)
  const walk = (n, d) => { n.depth = d; n.children.sort((a, b) => b.hits - a.hits); n.children.forEach(c => walk(c, d + 1)) }
  roots.sort((a, b) => b.hits - a.hits); roots.forEach(r => walk(r, 0))
  const groups = [...new Set(nodes.map(n => n.group))].sort()
  return { roots, nodes, groups }
}
const row_has = (row, col) => String(row[col] ?? '').trim() !== ''

// ======== lib/balloons.js ========
// Balloons: bodies that float and bounce, with no skin of their own (the sketch draws each as a
// cloud of fireflies). Each has a radius, a hue, a position and a velocity. Lift says how high they
// float: 0 rests them on the floor, 1 presses them under the ceiling, and between they hover at that
// share of the height, bobbing; they bounce off each other and the walls with a little spring in
// it; a breeze wanders through; a balloon tethered to another stays against it, like a grape on a
// bunch. Each carries an invisible sphere so a pointer can find it, which can be shown as a faint
// skin to read the grouping.
//
//   const balloons = createBalloons(THREE, scene, { ceiling: 7, floor: 0.6, walls: 6 })
//   const b = balloons.add({ radius: 0.5, color: '#6777B6' | hue: 0.6, tether: null | balloon, userData })
//   balloons.update(dt, { lift: 0.5, breeze: 0.3, bounce: 0.5, damping: 0.5 })
//   balloons.setSkin(0.08); balloons.pickables; b.pos, b.vel, b.radius, b.hue, b.userData

function createBalloons(THREE, scene, { ceiling = 7, floor = 0.6, walls = 6 } = {}) {
  const balloons = []
  const root = new THREE.Group(); root.name = 'balloons'; scene.add(root)
  const sphere = new THREE.SphereGeometry(1, 24, 18)
  let skinOpacity = 0
  const f = new THREE.Vector3(), d = new THREE.Vector3(), n = new THREE.Vector3()
  let t = 0

  function add({ radius = 0.3, hue = 0.6, color: given, tether = null, userData = {} } = {}) {
    const color = given !== undefined ? new THREE.Color(given) : new THREE.Color().setHSL(hue, 0.6, 0.6)
    const skin = new THREE.Mesh(sphere, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: skinOpacity, depthWrite: false, side: THREE.BackSide }))
    skin.scale.setScalar(radius); root.add(skin)
    const start = tether ? tether.pos : new THREE.Vector3((Math.random() - 0.5) * walls, floor + radius + Math.random() * 2, (Math.random() - 0.5) * walls)
    const pos = new THREE.Vector3(start.x + (Math.random() - 0.5) * radius * 2, start.y + (tether ? radius : 0), start.z + (Math.random() - 0.5) * radius * 2)
    const b = { skin, pos, vel: new THREE.Vector3(), radius, hue, color, tether, userData, phase: Math.random() * 100, mass: radius ** 3 }
    skin.position.copy(pos); skin.userData.balloon = b
    balloons.push(b)
    return b
  }

  function update(dt, { lift = 0.5, breeze = 0.3, bounce = 0.5, damping = 0.5 } = {}) {
    t += dt
    const step = Math.min(dt, 0.04)
    for (const b of balloons) {
      // the height it floats at: a share of the room between floor and ceiling, with a slow bob
      const want = floor + b.radius + Math.max(0, Math.min(1, lift)) * Math.max(0, ceiling - floor - 2 * b.radius) + 0.25 * Math.sin(t * 0.5 + b.phase)
      f.set(breeze * (Math.sin(t * 0.33 + b.phase) * 0.6 + Math.sin(t * 0.87 + b.phase * 1.7) * 0.25), (want - b.pos.y) * 1.2, breeze * Math.cos(t * 0.27 + b.phase * 0.6) * 0.6)
      if (b.tether) {                                                                // held against its parent, like a grape on the bunch
        d.subVectors(b.pos, b.tether.pos); const dist = d.length() || 1e-6, side = b.tether.radius + b.radius * 0.85
        f.addScaledVector(d.divideScalar(dist), -(dist - side) * 30)
        f.y = -0.4                                                                   // no lift of its own: it hangs beside its parent, a little below
      }
      b.vel.addScaledVector(f, step).multiplyScalar(Math.max(0, 1 - damping * step))
    }
    for (let i = 0; i < balloons.length; i++) for (let j = i + 1; j < balloons.length; j++) {   // bouncing off each other
      const a = balloons[i], c = balloons[j]
      if (a.tether === c || c.tether === a) continue
      d.subVectors(c.pos, a.pos); const dist = d.length(), gap = a.radius + c.radius
      if (dist >= gap || dist < 1e-6) continue
      n.copy(d).divideScalar(dist)
      const push = (gap - dist) * 0.5
      a.pos.addScaledVector(n, -push * c.mass / (a.mass + c.mass) * 2); c.pos.addScaledVector(n, push * a.mass / (a.mass + c.mass) * 2)
      const rel = c.vel.dot(n) - a.vel.dot(n)                                        // closing speed along the line between centres
      if (rel < 0) {
        const jn = -(1 + bounce) * rel / (1 / a.mass + 1 / c.mass)
        a.vel.addScaledVector(n, -jn / a.mass); c.vel.addScaledVector(n, jn / c.mass)
      }
    }
    for (const b of balloons) {
      b.pos.addScaledVector(b.vel, step)
      if (b.pos.y + b.radius > ceiling) { b.pos.y = ceiling - b.radius; b.vel.y = -Math.abs(b.vel.y) * bounce }       // bobbing under the ceiling
      if (b.pos.y - b.radius < floor) { b.pos.y = floor + b.radius; b.vel.y = Math.abs(b.vel.y) * bounce }
      for (const k of ['x', 'z']) {
        if (b.pos[k] + b.radius > walls) { b.pos[k] = walls - b.radius; b.vel[k] = -Math.abs(b.vel[k]) * bounce }
        if (b.pos[k] - b.radius < -walls) { b.pos[k] = -walls + b.radius; b.vel[k] = Math.abs(b.vel[k]) * bounce }
      }
      b.skin.position.copy(b.pos)
    }
  }

  function setSkin(opacity) { skinOpacity = opacity; for (const b of balloons) b.skin.material.opacity = opacity }
  function clear() { for (const b of balloons) { root.remove(b.skin); b.skin.material.dispose() } balloons.length = 0 }
  return { add, update, clear, setSkin, balloons, root, get pickables() { return balloons.map(b => b.skin) } }
}

// ======== lib/fireflies.js ========
// Fireflies: every hit a glowing point. A host (a balloon) gets `count` fireflies filling its sphere
// evenly; each keeps a home spot inside it, wanders a little, swirls slowly with the others round
// the host's axis, blinks to its own rhythm, and follows the host wherever it floats. One Points
// object holds all of them: a soft disc drawn on a small canvas, additive blending, a colour and a
// glow per point. If the hits outnumber `max`, each point stands for more than one hit (perPoint).
//
//   const flies = createFireflies(THREE, scene, { max: 200000, size: 0.12 })
//   flies.set([{ position: vec3 (live), radius: 0.5, color: '#6777B6' | hue: 0.6, count: 1245, size: 1 }, ...])
//   flies.update(dt, { blink: 1, glow: 0.25, disperse: 0 })
//   flies.rescale(host => multiplier)       // change each host's firefly size without rebuilding
//
// A host's `size` multiplies its flies' point size (1 = the base size), so spheres with few hits can
// have bigger fireflies than the crowded ones.
//
// A host's `color` (any THREE.Color input) is used as given, each fly a shade lighter or darker; with
// only a `hue` the colour is made from it.
//
// `disperse` runs from 0 to 1. At 0 every fly keeps to its own sphere. As it rises the spheres
// loosen (the flies drift further from their home spots) and flies begin to leave on visits: a fly
// picks one of the nearest neighbouring spheres, flies over, settles at a spot inside it for a few
// seconds and takes on that sphere's colour while it stays, then flies home carrying the colour it
// picked up, which fades back to its own only slowly. At 1 about a fifth of the flies are away at
// any moment and the spheres fill with mixed colours.

// `onLight: true` draws them for a light background: normal blending, a paler core when a fly is
// on, instead of the additive glow that only reads against the dark.
function createFireflies(THREE, scene, { max = 200000, size = 0.12, onLight = false } = {}) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64
  const g = cv.getContext('2d'), grad = g.createRadialGradient(32, 32, 0, 32, 32, 32)
  grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(0.3, 'rgba(255,255,255,0.75)'); grad.addColorStop(0.65, 'rgba(255,255,255,0.12)'); grad.addColorStop(1, 'rgba(255,255,255,0)')
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64)
  const sprite = new THREE.CanvasTexture(cv)

  const geo = new THREE.BufferGeometry()
  const positions = new Float32Array(max * 3), colors = new Float32Array(max * 3), glows = new Float32Array(max), scales = new Float32Array(max).fill(1)
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3))
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3))
  geo.setAttribute('glow', new THREE.BufferAttribute(glows, 1))
  geo.setAttribute('scale', new THREE.BufferAttribute(scales, 1))
  const mat = new THREE.ShaderMaterial({
    uniforms: { map: { value: sprite }, size: { value: size } },
    vertexShader: `attribute float glow; attribute float scale; attribute vec3 color; varying float vGlow; varying vec3 vColor; uniform float size;
      void main() { vGlow = glow; vColor = color; vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * scale * (0.7 + 0.8 * glow) * (300.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: onLight
      ? `uniform sampler2D map; varying float vGlow; varying vec3 vColor;
      void main() { vec4 s = texture2D(map, gl_PointCoord); vec3 c = mix(vColor * 0.85, vec3(1.0), 0.45 * vGlow); gl_FragColor = vec4(c, s.a * (0.5 + 0.5 * vGlow)); }`
      : `uniform sampler2D map; varying float vGlow; varying vec3 vColor;
      void main() { vec4 s = texture2D(map, gl_PointCoord); gl_FragColor = vec4(vColor * (0.3 + 1.4 * vGlow), s.a * (0.35 + 0.65 * vGlow)); }`,
    transparent: true, depthWrite: false, blending: onLight ? THREE.NormalBlending : THREE.AdditiveBlending,
  })
  const points = new THREE.Points(geo, mat); points.frustumCulled = false; points.name = 'fireflies'
  scene.add(points)

  // per fly: which host, home offset inside its sphere, blink phase and speed, wander phase, its own
  // colour; and for a visit: where it is (cur), where it is going (dest host, -1 = home), how long it stays
  let n = 0, perPoint = 1, hosts = []
  const hostOf = new Int32Array(max), home = new Float32Array(max * 3), phase = new Float32Array(max), speed = new Float32Array(max), wander = new Float32Array(max)
  const own = new Float32Array(max * 3), cur = new Float32Array(max * 3), spot = new Float32Array(max * 3)
  const dest = new Int32Array(max).fill(-1), stay = new Float32Array(max), away = new Uint8Array(max)   // away: 0 home, 1 going, 2 staying, 3 returning
  let hostRGB = new Float32Array(0), neighbours = new Int32Array(0), awayCount = 0, hostStart = new Int32Array(0), hostCount = new Int32Array(0)
  const NB = 4                                                  // neighbours a fly may visit: the nearest few spheres
  const col = new THREE.Color(), base = new THREE.Color()
  let t = 0, nbTimer = 0

  function set(list) {
    hosts = list
    const total = list.reduce((s, h) => s + h.count, 0)
    perPoint = total > max ? total / max : 1
    n = 0
    hostRGB = new Float32Array(list.length * 3); hostStart = new Int32Array(list.length); hostCount = new Int32Array(list.length)
    for (let hi = 0; hi < list.length; hi++) {
      const h = list[hi], count = Math.max(1, Math.round(h.count / perPoint))
      if (h.color !== undefined) base.set(h.color); else base.setHSL(h.hue ?? 0.58, 0.75, 0.6)
      base.toArray(hostRGB, 3 * hi)
      hostStart[hi] = n; hostCount[hi] = Math.min(count, max - n)                              // a host's flies sit together: indices hostStart .. hostStart + hostCount - 1
      for (let k = 0; k < count && n < max; k++, n++) {
        // an even fill of the sphere: a random direction, a radius weighted by the cube root
        const u = Math.random(), v = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, r = Math.cbrt(Math.random()) * h.radius * 0.95
        const s = Math.sqrt(1 - v * v)
        home[3 * n] = r * s * Math.cos(a); home[3 * n + 1] = r * v; home[3 * n + 2] = r * s * Math.sin(a)
        hostOf[n] = hi; phase[n] = u * Math.PI * 2; speed[n] = 0.5 + Math.random() * 1.5; wander[n] = Math.random() * 6.28
        col.copy(base).offsetHSL((Math.random() - 0.5) * 0.02, 0, (Math.random() - 0.5) * 0.14)   // each fly its own shade
        col.toArray(colors, 3 * n); col.toArray(own, 3 * n)
        scales[n] = h.size ?? 1
        away[n] = 0; dest[n] = -1
      }
    }
    neighbours = new Int32Array(list.length * NB).fill(-1); nbTimer = 0; awayCount = 0
    geo.attributes.color.needsUpdate = true; geo.attributes.scale.needsUpdate = true
    geo.setDrawRange(0, n)
  }

  function rescale(fn) {
    const per = hosts.map((h, i) => fn(h, i))
    for (let i = 0; i < n; i++) scales[i] = per[hostOf[i]]
    geo.attributes.scale.needsUpdate = true
  }

  // the nearest few spheres to each sphere, refreshed every half second as they drift
  function findNeighbours() {
    const H = hosts.length
    for (let a = 0; a < H; a++) {
      const pa = hosts[a].position, best = []
      for (let b = 0; b < H; b++) {
        if (b === a) continue
        const d = pa.distanceToSquared(hosts[b].position)
        if (best.length < NB) best.push([d, b]); else if (d < best[NB - 1][0]) best[NB - 1] = [d, b]
        best.sort((x, y) => x[0] - y[0])
      }
      for (let k = 0; k < NB; k++) neighbours[a * NB + k] = best[k] ? best[k][1] : -1
    }
  }

  function update(dt, { blink = 1, glow = 0.25, disperse = 0 } = {}) {
    t += dt
    const step = Math.min(dt, 0.05)
    nbTimer -= step
    if (hosts.length > 1 && disperse > 0 && nbTimer <= 0) { findNeighbours(); nbTimer = 0.5 }
    const hc = hosts.map(h => Math.cos(t * 0.12 / Math.max(0.3, h.radius))), hs = hosts.map(h => Math.sin(t * 0.12 / Math.max(0.3, h.radius)))   // a slow swirl, slower for big clouds
    const loosen = 1 + 0.8 * disperse                         // the sphere puffs up as the flies drift further from home

}

// ======== lib/labels.js ========
// Text in the scene: a sprite per label, drawn on a canvas with a soft dark backing, sized in metres
// so it reads at a distance, always facing the camera. A second, smaller line is optional.
//
//   const label = makeLabel(THREE, 'new materialism', { sub: '1,245 hits', height: 0.22 })
//   label.position.set(x, y, z); scene.add(label); label.setText('…', '…'); label.dim(true)

function makeLabel(THREE, text, { sub = '', height = 0.2, color = '#ffffff', subColor = '#c9d2e3', backing = 'rgba(8,10,16,0.62)', font = 'system-ui, sans-serif' } = {}) {
  const cv = document.createElement('canvas'), g = cv.getContext('2d')
  const mat = new THREE.SpriteMaterial({ transparent: true, depthWrite: false, depthTest: false })
  const sprite = new THREE.Sprite(mat); sprite.renderOrder = 10
  const draw = (main, small) => {
    const px = 40, sm = 26, pad = 14
    g.font = `600 ${px}px ${font}`; const w1 = g.measureText(main).width
    g.font = `${sm}px ${font}`; const w2 = small ? g.measureText(small).width : 0
    const w = Math.ceil(Math.max(w1, w2) + pad * 2), h = px + (small ? sm + 8 : 0) + pad * 2
    cv.width = w; cv.height = h
    g.fillStyle = backing; g.beginPath(); g.roundRect(0, 0, w, h, 12); g.fill()
    g.textBaseline = 'top'; g.fillStyle = color; g.font = `600 ${px}px ${font}`; g.fillText(main, pad, pad - 2)
    if (small) { g.fillStyle = subColor; g.font = `${sm}px ${font}`; g.fillText(small, pad, pad + px + 4) }
    if (mat.map) mat.map.dispose()
    mat.map = new THREE.CanvasTexture(cv); mat.map.colorSpace = THREE.SRGBColorSpace; mat.needsUpdate = true
    sprite.scale.set(height * w / h * (small ? 1 : 0.62 * h / px), height * (small ? 1 : 0.62), 1)   // height is the box height in metres
  }
  draw(text, sub)
  sprite.setText = (main, small = '') => draw(main, small)
  sprite.dim = on => { mat.opacity = on ? 0.35 : 1 }
  return sprite
}

// ======== lib/floorcurve.js ========
// The floor: a line pattern and, if wanted, a sheet of old green bottle glass, both laid over a
// height field that rises toward whatever floats above it, as if reaching, and undulates slowly.
//
// The pattern is one of: an Archimedean spiral or a Hilbert curve (one continuous line), a
// triangular lattice or a honeycomb (many short segments), or none. Its heights are recomputed on the
// CPU every frame from the bodies passed in. The glass is a plane of the same size whose vertices are
// lifted by the same height function in a vertex shader (the bodies go in as uniforms, up to 64), with
// a fragment shader for the look: a green tint that deepens where the glass is seen edge-on or lies
// low, a fresnel sheen, one soft highlight, and the slight waviness of old glass.
//
//   const floor = createFloorCurve(THREE, scene, { kind: 'spiral', radius: 7, spacing: 0.3, color: '#92A2A6', opacity: 0.5, glass: true, tint: '#9CC2A0' })
//   floor.update(dt, { hosts: [{ position, radius }], reach: 0.35, undulate: 0.1 })
//   floor.setKind('honeycomb')   // 'spiral' | 'hilbert' | 'triangles' | 'honeycomb' | 'none'
//   floor.setGlass(true); floor.setTint('#9CC2A0')
//
// reach: how far up toward each body the floor rises, as a share of the body's height above the
// ground (0 = flat); undulate: the height of a slow travelling swell in metres.

const MAX_HOSTS = 64

function createFloorCurve(THREE, scene, { kind = 'spiral', radius = 7, spacing = 0.3, step = 0.1, order = 6, color = '#92A2A6', opacity = 0.5, y0 = 0, glass = true, tint = '#9CC2A0' } = {}) {
  const group = new THREE.Group(); group.name = 'floor'; scene.add(group)
  const lineMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity })
  let line = null, base = null, pts = 0, segments = false, t = 0
  const hx = new Float32Array(MAX_HOSTS), hz = new Float32Array(MAX_HOSTS), hr = new Float32Array(MAX_HOSTS), ht = new Float32Array(MAX_HOSTS)
  let H = 0

  // ---- the patterns, as flat xz point lists (a path, or pairs for segments) ----
  function spiral() {                                                 // r = a·θ, sampled at an even arc length
    const a = spacing / (2 * Math.PI), out = []
    let theta = 0
    while (a * theta < radius) { const r = a * theta; out.push(r * Math.cos(theta), r * Math.sin(theta)); theta += step / Math.max(0.05, r) }
    return { points: out, segments: false }
  }
  function hilbert() {                                                // the classic d → (x, y) walk, scaled to a square 2·radius wide
    const n = 1 << order, out = [], size = 2 * radius / n
    for (let d = 0; d < n * n; d++) {
      let x = 0, y = 0, tt = d
      for (let s = 1; s < n; s *= 2) {
        const rx = 1 & (tt / 2), ry = 1 & (tt ^ rx)
        if (ry === 0) { if (rx === 1) { x = s - 1 - x; y = s - 1 - y } const k = x; x = y; y = k }
        x += s * rx; y += s * ry; tt = Math.floor(tt / 4)

    }
    return { points: out, segments: false }
  }
  const subdivided = (ax, az, bx, bz, out, n = 3) => {                // an edge in n pieces, so it can follow the field
    for (let k = 0; k < n; k++) { const u = k / n, v = (k + 1) / n; out.push(ax + (bx - ax) * u, az + (bz - az) * u, ax + (bx - ax) * v, az + (bz - az) * v) }
  }
  function triangles() {                                              // three families of parallel lines at 60°, a lattice of equilateral triangles
    const out = [], d = spacing * 1.6, L = radius * 1.05
    for (const ang of [0, Math.PI / 3, 2 * Math.PI / 3]) {

  }

  }
  const PATTERNS = { spiral, hilbert, triangles, honeycomb }

  function setKind(k) {

    for (let i = 0; i < pts; i++) { pos[3 * i] = base[2 * i]; pos[3 * i + 1] = y0; pos[3 * i + 2] = base[2 * i + 1] }

  }

  // ---- the glass: the same height function on the GPU, and the look of old bottle glass ----
  const glassMat = new THREE.ShaderMaterial({
    uniforms: {
      hosts: { value: Array.from({ length: MAX_HOSTS }, () => new THREE.Vector4()) }, nHosts: { value: 0 },
      reach: { value: 0.35 }, undulate: { value: 0.1 }, time: { value: 0 }, y0: { value: y0 },
      tint: { value: new THREE.Color(tint) }, lightDir: { value: new THREE.Vector3(0.4, 1, 0.3).normalize() },
    },
    vertexShader: `
      uniform vec4 hosts[${MAX_HOSTS}]; uniform int nHosts; uniform float reach, undulate, time, y0;
      varying vec3 vNormal; varying vec3 vWorld; varying float vLift;
      float heightAt(vec2 p) {
        float y = undulate * sin(0.9 * p.x + time * 0.5) * cos(0.9 * p.y - time * 0.4);
        for (int k = 0; k < ${MAX_HOSTS}; k++) {
          if (k >= nHosts) break;

      }
      void main() {
        vec2 p = position.xz;

      }`,
    fragmentShader: `
      uniform vec3 tint; uniform vec3 lightDir;
      varying vec3 vNormal; varying vec3 vWorld; varying float vLift;
      void main() {
        vec3 n = normalize(vNormal); vec3 v = normalize(cameraPosition - vWorld);

        n = normalize(n + 0.06 * vec3(sin(vWorld.x * 7.0 + vWorld.z * 3.0), 0.0, cos(vWorld.z * 6.0 - vWorld.x * 2.0)));
        float fres = pow(1.0 - max(dot(n, v), 0.0), 2.5);                 // bright at the edges, like a bottle's rim
        float spec = pow(max(dot(reflect(-lightDir, n), v), 0.0), 60.0);  // one soft highlight
        float thick = clamp(0.35 + 0.25 * vLift, 0.0, 1.0);                // the glass reads thicker where it rises
        vec3 deep = tint * vec3(0.45, 0.62, 0.5);                           // the colour seen through more glass
        vec3 col = mix(tint, deep, thick) * (0.55 + 0.45 * max(dot(n, lightDir), 0.0));
        col += fres * tint * 0.9 + spec * vec3(0.9, 1.0, 0.92);
        float alpha = 0.22 + 0.5 * fres + 0.35 * spec;
        gl_FragColor = vec4(col, alpha);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
  })
  const plane = new THREE.PlaneGeometry(2 * radius, 2 * radius, 96, 96); plane.rotateX(-Math.PI / 2)
  const sheet = new THREE.Mesh(plane, glassMat); sheet.frustumCulled = false; sheet.raycast = () => {}; sheet.renderOrder = -1; sheet.visible = glass
  group.add(sheet)

  function update(dt, { hosts = [], reach = 0.35, undulate = 0.1 } = {}) {
    t += dt
    // the bodies, the largest first, at most MAX_HOSTS
    const list = hosts.length > MAX_HOSTS ? hosts.slice().sort((a, b) => b.radius - a.radius).slice(0, MAX_HOSTS) : hosts
    H = list.length
    for (let k = 0; k < H; k++) {
      const h = list[k]; hx[k] = h.position.x; hz[k] = h.position.z; hr[k] = h.radius * 2.2; ht[k] = Math.max(0, h.position.y - h.radius - y0) * reach

    }
    glassMat.uniforms.nHosts.value = H; glassMat.uniforms.reach.value = reach; glassMat.uniforms.undulate.value = undulate; glassMat.uniforms.time.value = t

    for (let i = 0; i < pts; i++) {
      const x = base[2 * i], z = base[2 * i + 1]
      let y = undulate * Math.sin(0.9 * x + t * 0.5) * Math.cos(0.9 * z - t * 0.4)
      for (let k = 0; k < H; k++) {                                   // the nearest body lifts the floor most; a soft peak, not a spike
        const dx = x - hx[k], dz = z - hz[k], d2 = dx * dx + dz * dz, r2 = hr[k] * hr[k]
        if (d2 > 6 * r2) continue                                     // too far to matter (the lift would be under e⁻⁶)
        const lift = Math.exp(-d2 / r2) * ht[k]; if (lift > y) y = lift

    }
    line.geometry.attributes.position.needsUpdate = true
  }

  setKind(kind)
  return {
    group, update, setKind, get kind() { return kind }, get points() { return pts }, material: lineMat,
    setGlass(on) { sheet.visible = on }, setTint(c) { glassMat.uniforms.tint.value.set(c) }, glass: sheet,
  }
}

// ======== lib/bottle.js ========
// The bottle: the whole background as the side of an old glass soda bottle seen from inside, so the
// scene floats in pale blue-green glass. A full-screen quad behind everything, drawn by one fragment
// shader. The screen is read as the inside of a bottle: a ray from the eye, at an angle round the
// bottle, meets the glass, which is either a round wall (every point the same distance away) or, for a
// faceted bottle, one of `sides` flat panes (an octagon by default), each pane met at its own slant.
// The bottle's profile with height is an octagon's too: every vertical line runs straight through the
// middle, turns inward at 45 degrees toward top and bottom, then runs straight again. On the glass:
// wide soft stripes of pressed glass (two to a pane), leaning a different way on every pane so they
// kink at the pane edges; the pane edges themselves as bright ridges; a bright band where the light
// comes through, stepped from pane to pane; hoops of flow lines kept to a whisper; a slow waviness; a
// few bubbles. Nothing moves fast. `curve` is how round the bottle is (0 wide and flat, 1 tight);
// `sides` is 0 for a round bottle or the number of panes; `bend` is how far the lines turn and lean.
//
//   const bottle = createBottle(THREE, scene, { tint: '#BFDCE8', deep: '#8FB8C8', light: '#F2F8FA', curve: 0.6, sides: 8, bend: 0.7 })
//   bottle.update(dt)            // drifts the waviness
//   bottle.setTint(hex) / setDeep(hex) / setLight(hex) / setCurve(0..1) / setSides(n) / setBend(0..1); bottle.visible = false

function createBottle(THREE, scene, { tint = '#BFDCE8', deep = '#8FB8C8', light = '#F2F8FA', curve = 0.6, sides = 8, bend = 0.7 } = {}) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { tint: { value: new THREE.Color(tint) }, deep: { value: new THREE.Color(deep) }, light: { value: new THREE.Color(light) }, time: { value: 0 }, aspect: { value: 1 }, curve: { value: curve }, sides: { value: sides }, bend: { value: bend } },
    vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 1.0, 1.0); }`,   // the far plane, behind everything
    fragmentShader: `
      uniform vec3 tint, deep, light; uniform float time, aspect, curve, sides, bend; varying vec2 vUv;
      float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float noise(vec2 p) { vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y); }
      void main() {
        vec2 p = vec2((vUv.x - 0.5) * aspect, vUv.y - 0.5);
        float wave = noise(vec2(p.x * 3.0 + time * 0.05, p.y * 2.0 - time * 0.03)) - 0.5;          // the glass was never flat
        float faceted = step(2.5, sides);
        // the bottle's profile with height is an octagon's: straight through the middle, then a 45-degree run
        // inward toward top and bottom, then straight again. Every vertical line on the glass follows it.
        float prof = clamp((abs(p.y) - 0.1) / 0.14, 0.0, 1.0);
        float spread = 1.0 + bend * 1.25 * prof;
        vec2 q = vec2(p.x * spread, p.y);                                                          // the screen point, read on that profile
        // the ray from the eye: its angle round the bottle, and where it meets the glass
        float R = mix(mix(4.0, 0.95, curve), mix(2.2, 0.55, curve), faceted);                       // the bottle's radius on screen: wide and flat, or tight (faceted: three to five panes in view)
        R *= clamp(aspect / 1.5, 0.35, 1.0);                                                       // a narrow screen sees a tighter bottle, so the panes still show
        float phi = asin(clamp(q.x / R, -0.999, 0.999));                                           // the ray's angle round the bottle
        float seg = 6.2831853 / max(sides, 3.0);                                                   // the angle one pane spans
        float fi = floor((phi + 0.5 * seg) / seg);                                                 // which pane the ray meets (0 faces us)
        float phic = fi * seg;                                                                     // that pane's centre angle
        float u = faceted * (phi - phic);                                                          // the ray's slant across the pane (0 on a round wall)
        float s = mix(phi, 2.0 * tan(0.5 * seg) * fi + tan(u), faceted) * R;                      // distance round the glass: the arc, or along the panes
        float ratio = cos(u) / max(cos(phi), 0.15);                                                // how much nearer the glass is here than straight ahead
        float glance = abs(q.x) / R;                                                               // how glancing the view of the glass is here
        s += faceted * bend * 0.3 * sin(phic) * p.y;                                               // on a faceted bottle each pane's lines lean its own way too
        float freq = mix(11.0, 6.2831853 / (R * tan(0.5 * seg)), faceted);                         // stripes: a steady width, or two to a pane
        float ribs = pow(0.5 + 0.5 * cos((s + 0.04 * wave) * freq), 2.2);                          // wide soft stripes of pressed glass
        float lit = 0.5 + 0.5 * cos(phic + 0.45);                                                  // how squarely each pane faces the light
        float ridge = faceted * exp(-pow((0.5 * seg - abs(u)) * 90.0, 2.0)) * (0.15 + 0.35 * lit); // the pane edges, bright ridges
        float corner = faceted * pow(abs(u) / (0.5 * seg), 3.0) * 0.18;                            // glass thicker toward the pane edges

        float edge = smoothstep(0.1, 0.95, max(glance * glance, length(vec2(p.x * 0.55, p.y)) * 0.9)); // thicker glass toward the edges

// ======== the sketch ========
// Bouquet: the hits for each search term, and for each narrower term under it, read from a CSV.
// Every single hit is a firefly, a point blinking to its own rhythm. All the hits of a term gather
// into a sphere of fireflies, sized so they fill it evenly (the radius grows with the cube root of
// the hits), and the spheres float together, bobbing and bouncing off each other like balloons. A
// term that narrows another is a smaller sphere held against its parent. The whole scene floats in
// the side of an old glass soda bottle: pale blue-green glass behind everything, white boxes for
// the text and controls, navy text.
//
// The states, from a states file (one row per term, one number column per state):
//   all hits              every result returned under a keyword term
//   distinct hits         the same with repeats of one work within a term removed
//   overlapping hits      the term's distinct works also returned under another keyword term; lines
//                         join the spheres that share works, heavier for more
//   forward citations     the two citing-works sweeps (Barad, Shlain), a different instrument; the
//                         works that cite both drawn as a tie between the two spheres
//   texts on disk         the term's works actually held as files under OneDrive\UNM
//   used in the comps     the term's works whose title is in the reference list of the comprehensive
//                         exam (April 22, 2026), out of the texts held
//   (snowball)            in those last two states, a sphere of its own for the texts held or cited that
//                         no search returned: the row with kind "snowball" in the states file
// Any CSV with a term column and a number column still works as a single state.
//   ?sketch=bouquet                                      the sample file
//   ?sketch=bouquet&csv=<url>&overlaps=<url>&works=<url> another states file, its term pairs, its shared works
//
// The pieces, each on its own:
//   lib/csv.js        reading the file, guessing the columns, drop and file picker      (section 1)
//   lib/terms.js      terms and their narrowings as a tree                               (section 2)
//   lib/balloons.js   the floating, bouncing bodies: lift, ceiling, walls, tethers      (section 3)
//   lib/fireflies.js  one point per hit, filling each body's sphere, blinking, visiting  (section 4)
//   lib/labels.js     a sprite label per sphere                                          (section 5)
//   lib/floorcurve.js the floor as a spiral, Hilbert, triangle or honeycomb line        (section 7)
//   lib/bottle.js     the bottle-glass background                                        (section 8)
//   this file         the states, hits to radius and colour, the ties, picking, hover, click, the panel, the look

// column, which kind of row it shows (the two forward-citation sweeps are a different instrument
// from the keyword searches and get a state of their own).
const STATES = {
  'all hits (keyword searches)': { col: 'hits_all', kind: 'keyword' },
  'distinct hits': { col: 'hits_distinct', base: 'hits_all', kind: 'keyword' },
  'overlapping hits': { col: 'hits_overlapping', base: 'hits_distinct', kind: 'keyword' },
  'forward citations (Barad, Shlain)': { col: 'hits_distinct', base: 'hits_all', kind: 'forward citation', unit: 'citing works' },
  'texts on disk': { col: 'on_disk', base: 'hits_distinct', unit: 'texts held' },
  'used in the comps': { col: 'used_in_comps', base: 'on_disk', unit: 'used in the comps' },
}
const params = { state: 'all hits (keyword searches)', minHits: 0, scale: 0.055, colourBy: 'group', ties: 'works', lift: 0.45, breeze: 0.3, bounce: 0.5, blink: 1, glow: 0.25, disperse: 0, pointSize: 0.14, smallBoost: 1.5, skin: 0, labels: 'broad terms', labelTop: 16, floorOn: true, floor: 'spiral', floorAlpha: 0.22, glassFloor: false, reach: 0.35, undulate: 0.1, bottle: true, curve: 0.6, sides: 8, bend: 0.7, tint: '#BFDCE8' }

  if (!balloons) return
  balloons.update(dt, { lift: params.lift, breeze: params.breeze, bounce: params.bounce, damping: 0.5 })
  flies.update(dt, { blink: params.blink, glow: params.glow, disperse: params.disperse })
  if (params.floorOn) floor.update(dt, { hosts: balloons.balloons.map(b => ({ position: b.pos, radius: b.radius })), reach: params.reach, undulate: params.undulate })
  bottle.update(dt)
  placeLabels(); placeLinks()
  if (focused) ctx.controls.target.lerp(focused.pos, Math.min(1, dt * 3))
}

function onSelect(hit, { controls, camera, hint, xr }, ray) {
  const b = xr ? (ray ? pick.alongRay(ray) : balloonOf(hit?.object)) : pick.at(pick.pointer.x, pick.pointer.y, camera)
  if (!b) { focused = null; hint(overview()); return }
  focused = b
  const toCam = camera.position.clone().sub(controls.target).normalize()
  camera.position.copy(b.pos).addScaledVector(toCam, Math.max(2.5, b.radius * 5))
  controls.target.copy(b.pos)
  hint(describe(b))
}


// ======== the page's own harness: renderer, camera, controls, panel, loop ========
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 200)
const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight) })
const hintEl = document.getElementById('hint')
const selectables = []
const ctx = { THREE, scene, camera, controls, renderer, hint: t => { hintEl.textContent = t }, gui: new GUI({ title: 'bouquet' }), selectable: o => { selectables.push(o); return o } }
window.ctx = ctx                                    // poke at the scene from DevTools, as in the dev harness
addEventListener('dragenter', () => document.body.classList.add('dragging'))
addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('dragging') })
addEventListener('drop', () => document.body.classList.remove('dragging'))
await setup(ctx)
if (innerWidth < 600) ctx.gui.close()

// a tap: first tells, a second on the same sphere looks closer (a mouse click looks closer at once)
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2()
let downX = 0, downY = 0, lastTapped = null
renderer.domElement.addEventListener('pointerdown', e => { downX = e.clientX; downY = e.clientY })
renderer.domElement.addEventListener('pointerup', e => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); raycaster.setFromCamera(pointer, camera)
  const hit = raycaster.intersectObjects(selectables, true)[0] ?? null
  const b = pick.at(pointer.x, pointer.y, camera)
  if (b && e.pointerType !== 'mouse' && lastTapped !== b) { lastTapped = b; ctx.hint(describe(b) + ' · tap again to look closer'); return }
  lastTapped = b; onSelect(hit, ctx, raycaster.ray)
})

const clock = new THREE.Clock()
function frame() { const dt = Math.min(clock.getDelta(), 0.1); draw(ctx, dt); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame) }
frame()
</script>
