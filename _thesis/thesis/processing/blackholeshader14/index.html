<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Hole Shader (July 14)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #blackholeshader14-sketch { position: fixed; inset: 0; }
    #blackholeshader14-sketch canvas { display: block; }
    #hint {
      position: fixed; left: 12px; bottom: 12px; z-index: 2;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: rgba(255,255,255,0.55); background: rgba(0,0,0,0.35);
      padding: 8px 10px; border-radius: 6px; pointer-events: none;
      transition: opacity 1s ease; opacity: 1;
    }
    #hint.fade { opacity: 0; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>
  <div id="blackholeshader14-sketch"></div>
  <div id="hint">
    ↑/↓ radius · ←/→ speed · mouse X ring spacing · mouse Y bumpiness · 0 reset
  </div>
  <!-- pause control: must load before the sketch -->
  <script src="motion.js"></script>
  <script src="blackholeshader14.js"></script>
  <script>
    setTimeout(function () {
      var h = document.getElementById('hint');
      if (h) h.classList.add('fade');
    }, 6000);
  </script>
</body>
</html>
