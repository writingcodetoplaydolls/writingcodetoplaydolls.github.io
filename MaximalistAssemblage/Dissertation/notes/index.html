*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);

.app{display:flex;height:100vh;overflow:hidden}

.list{overflow-y:auto;flex:1;padding:6px}
.list a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);

.list a small{display:block;color:var(--muted);font-size:11px;margin-top:1px;

.list .empty{padding:14px 10px;color:var(--muted);font:13px system-ui,sans-serif}
.main{flex:1;overflow-y:auto;height:100%}
.content{max-width:760px;margin:0 auto;padding:40px 28px 120px}
.content h1,.content h2,.content h3{line-height:1.25;font-family:Georgia,serif}

.content h3{font-size:17px;margin:1.3em 0 .4em}
.content a{color:var(--accent)}
.content code{background:var(--accentbg);padding:.1em .35em;border-radius:4px;

.content pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;

.content pre code{background:none;padding:0}
.content blockquote{margin:1em 0;padding:.3em 1em;border-left:3px solid var(--accent);
  color:var(--muted)}
.content table{border-collapse:collapse;margin:1em 0;font-size:.92em}
.content th,.content td{border:1px solid var(--line);padding:6px 10px;text-align:left}
.content img{max-width:100%}
.menu-btn{display:none}
@media (max-width:760px){

  .sidebar{width:100%;flex:0 0 auto;max-height:45vh}

const listEl = document.getElementById('list');
const contentEl = document.getElementById('content');
const qEl = document.getElementById('q');
let active = null;

marked.setOptions({gfm:true, breaks:false});

function render(items){
  listEl.innerHTML = '';
  if(!items.length){ listEl.innerHTML = '<div class="empty">No matches.</div>'; return; }
  for(const it of items){
    const a = document.createElement('a');
    a.href = '#'+encodeURIComponent(it.file);
    a.dataset.file = it.file;
    a.innerHTML = '<span></span><small></small>';
    a.querySelector('span').textContent = it.title;
    a.querySelector('small').textContent = it.file;
    if(it.file===active) a.classList.add('active');
    a.onclick = e=>{ e.preventDefault(); location.hash = encodeURIComponent(it.file); };
    listEl.appendChild(a);
  }
}

async function load(file){
  active = file;
  for(const a of listEl.children){ if(a.dataset) a.classList.toggle('active', a.dataset.file===file); }
  const hit = NOTES.find(n=>n.file===file);
  contentEl.innerHTML = '<p style="color:var(--muted);font-family:system-ui">Loading…</p>';
  try{
    const r = await fetch('./'+encodeURIComponent(file), {cache:'no-cache'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const md = await r.text();
    contentEl.innerHTML = marked.parse(md);
    document.querySelector('.main').scrollTop = 0;
    document.title = (hit? hit.title : file) + ' — Notes';
  }catch(err){
    contentEl.innerHTML = '<h1>Could not load</h1><p style="font-family:system-ui">'+
      file+' — '+err.message+'</p><p style="font-family:system-ui;color:var(--muted)">'+
      'If you are viewing this from a local file:// path, run it through a web server '+
      '(the notes fetch needs http). On GitHub Pages it will work.</p>';
  }
  const link = [...listEl.children].find(a=>a.dataset && a.dataset.file===file);
  if(link) link.scrollIntoView({block:'nearest'});
}

function filter(){
  const q = qEl.value.trim().toLowerCase();
  render(!q ? NOTES : NOTES.filter(n=>
    n.title.toLowerCase().includes(q) || n.file.toLowerCase().includes(q)));
}

function fromHash(){
  const h = decodeURIComponent((location.hash||'').replace(/^#/,''));
  if(h && NOTES.some(n=>n.file===h)) load(h);
  else if(NOTES.length) load(NOTES[0].file);
}

qEl.addEventListener('input', filter);
window.addEventListener('hashchange', fromHash);
render(NOTES);
fromHash();
</script>
